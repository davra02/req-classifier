[tool.uv.workspace]
members = ["packages/reqcore", "bench"]

[tool.uv.sources]
reqcore = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["packages/reqcore/tests", "bench/tests"]
