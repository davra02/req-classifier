[project]
name = "reqbench"
version = "0.1.0"
description = "Benchmark and evaluation of requirement classifiers (rules, classical ML, transformer, LLM, Jev)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "reqcore",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
]

[project.scripts]
reqbench = "reqbench.cli:main"

[tool.uv.sources]
reqcore = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.20"]
build-backend = "uv_build"
